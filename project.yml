name: DropShelf
options:
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
packages:
  DropShelfCodecs:
    path: ThirdParty/DropShelfCodecs
targets:
  DropShelf:
    type: application
    platform: macOS
    sources:
      - Sources
      - path: Resources
        excludes: [dmg]  # DMG-Hintergrund gehört nicht ins App-Bundle
      - path: THIRD-PARTY-LICENSES.md
        buildPhase: resources
      - path: LICENSE
        buildPhase: resources
      - path: NOTICE
        buildPhase: resources
    dependencies:
      - package: DropShelfCodecs
        product: DropShelfCodecs
    info:
      path: Info.plist
      properties:
        LSUIElement: true
        CFBundleName: DropShelf
        CFBundleShortVersionString: "3.1"
        CFBundleVersion: "3"
    entitlements:
      path: DropShelf.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.network.client: true
        com.apple.security.files.downloads.read-write: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.horn2208.DropShelf
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  DropShelf Troll:
    type: application
    platform: macOS
    sources: [Sources, {path: Resources, excludes: [dmg]}, Troll]
    dependencies:
      - package: DropShelfCodecs
        product: DropShelfCodecs
    info:
      path: Info.plist
      properties:
        LSUIElement: true
        CFBundleName: DropShelf
        CFBundleShortVersionString: "3.1"
        CFBundleVersion: "3"
    entitlements:
      path: DropShelf.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.network.client: true
        com.apple.security.files.downloads.read-write: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.horn2208.DropShelf.troll
        PRODUCT_NAME: DropShelf
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) TROLL"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  DropShelf Troll kurz:
    type: application
    platform: macOS
    sources: [Sources, {path: Resources, excludes: [dmg]}, Troll]
    dependencies:
      - package: DropShelfCodecs
        product: DropShelfCodecs
    info:
      path: Info.plist
      properties:
        LSUIElement: true
        CFBundleName: DropShelf
        CFBundleShortVersionString: "3.1"
        CFBundleVersion: "3"
    entitlements:
      path: DropShelf.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.network.client: true
        com.apple.security.files.downloads.read-write: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.horn2208.DropShelf.trollkurz
        PRODUCT_NAME: DropShelf
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) TROLL TROLL_SHORT"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # Hostless Unit-Tests: kompiliert die Quellen direkt ins Test-Bundle (ohne DropShelfApp.swift), startet die App nie.
  DropShelfTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Sources
        excludes: [DropShelfApp.swift]
      - Tests
    dependencies:
      - package: DropShelfCodecs
        product: DropShelfCodecs
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.horn2208.DropShelf.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"

schemes:
  DropShelf:
    build:
      targets:
        DropShelf: all
    test:
      targets: [DropShelfTests]
